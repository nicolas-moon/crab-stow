[package]
name = "crab-stow"
version = "0.2.0"
edition = "2021"
authors = ["Nicolas Moon <nmoon@nickmoon.rocks"]
description = "A Rust implementation of GNU stow"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"

[dev-dependencies]
tempfile = "3"
